[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ytc"
version = "0.1.0"
description = "Wonder Bites: offline pipeline that turns episode scripts into finished YouTube videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.4.9",
    "piper-tts>=1.3",
]

[project.optional-dependencies]
upload = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
]
draft = ["anthropic>=0.80"]
edge = ["edge-tts>=7.0"]
dev = ["pytest>=8"]

[project.scripts]
ytc = "ytc.cli:main"

[tool.setuptools]
packages = ["ytc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
