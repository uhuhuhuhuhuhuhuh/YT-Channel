title: "The Fish With a GLOWING Lantern 🐟✨ Spooky Bites #shorts"
series: spooky
format: short
bg: deepsea
description: |
  👻 Spooky Bites: creepy-but-true!
  Way down in the deep, dark sea lives a fish with its very own glowing lantern. 🐟✨
  Meet the anglerfish, and the tiny glowing helpers that light its way.

  🌟 Wonder Bites: bite-sized facts for curious kids. Spooky Bites every Friday!
tags: [anglerfish, deep sea animals for kids, bioluminescence for kids, ocean facts for kids, spooky facts for kids, spooky bites, wonder bites]
thumbnail:
  text: "GLOWING LANTERN FISH!"
  sprites: [fish, glowing star]
  bg: deepsea

segments:
  - say: Way down deep in the ocean, where sunlight never reaches, it's darker than the darkest night.
    headline: "THE DEEP SEA"
    sprites:
      - {name: water wave, x: 0.5, y: 0.3, size: 0.2, motion: float, enter: fade}

  - say: But look. A tiny light is glowing in the dark.
    headline: "WHAT'S THAT?"
    sprites:
      - {name: glowing star, x: 0.5, y: 0.45, size: 0.14, motion: pulse, enter: fade}

  - say: It belongs to an anglerfish! It has a glowing lure on its head, like a fishing rod with a light on the end.
    headline: "ANGLERFISH!"
    sprites:
      - {name: glowing star, x: 0.3, y: 0.36, size: 0.1, motion: pulse}
      - {name: fish, x: 0.55, y: 0.48, size: 0.44, motion: float, flip: true, delay: 0.4}

  - say: The glow comes from millions of tiny living things called bacteria, living inside the lure.
    headline: "GLOWING HELPERS"
    sprites:
      - {name: glowing star, x: 0.3, y: 0.36, size: 0.1, motion: pulse}
      - {name: fish, x: 0.55, y: 0.48, size: 0.44, motion: float, flip: true, delay: 0.4}
      - {name: microscope, x: 0.8, y: 0.28, size: 0.14, motion: pop, delay: 0.6}

  - say: Little fish swim over to see the light, and gulp! Snack time.
    headline: "GULP!"
    sprites:
      - {name: glowing star, x: 0.3, y: 0.36, size: 0.1, motion: pulse}
      - {name: fish, x: 0.55, y: 0.48, size: 0.44, motion: float, flip: true, delay: 0.4}
      - {name: tropical fish, x: 0.05, y: 0.4, size: 0.12, motion: walk, to: [0.25, 0.4], enter: fade}

  - say: Only the girl anglerfish have the glowing lure. The boy anglerfish are much, much smaller!
    headline: "TINY BOYS"
    sprites:
      - {name: fish, x: 0.45, y: 0.46, size: 0.44, motion: float, flip: true}
      - {name: fish, x: 0.8, y: 0.56, size: 0.08, motion: wiggle, flip: true, delay: 0.8}

  - say: Quick quiz! What makes the anglerfish's light glow? Say it out loud!
    headline: "QUIZ TIME!"
    sprites:
      - {name: fish, x: 0.5, y: 0.46, size: 0.4, motion: bounce, flip: true}
      - {name: red question mark, x: 0.82, y: 0.3, size: 0.14, motion: wiggle, delay: 0.5}
    pause: 1.3

  - say: Tiny bacteria! Glowing friends in the deep, dark sea. See you next Spooky Bites!
    headline: "BACTERIA!"
    sprites:
      - {name: fish, x: 0.5, y: 0.46, size: 0.4, motion: bounce, flip: true}
      - {name: sparkles, x: 0.2, y: 0.3, size: 0.14, motion: pulse, delay: 0.3}

sources:
  - "Monterey Bay Aquarium, Deep-sea anglerfish: https://www.montereybayaquarium.org/animals-the-ocean/animals-a-to-z/deep-sea-anglerfish"
  - "Woods Hole Oceanographic Institution, Creature Feature: Anglerfish: https://twilightzone.whoi.edu/explore-the-otz/creature-features/anglerfish/"
  - "Smithsonian Ocean, Bioluminescence: https://ocean.si.edu/ocean-life/fish/bioluminescence"
