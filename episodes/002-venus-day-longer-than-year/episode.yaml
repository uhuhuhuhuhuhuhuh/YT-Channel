title: "A Day on Venus Is Longer Than Its YEAR?! 🪐 #shorts"
series: facts
format: short
bg: space
description: |
  On Venus, one day lasts longer than one whole year! 🪐
  Find out why, and which way the Sun rises on Venus.

  🌟 Wonder Bites: bite-sized facts for curious kids. A new fun fact every weekday!
tags: [venus, venus facts, planets for kids, space facts for kids, solar system for kids, fun facts for kids, science for kids, wonder bites]
thumbnail:
  text: "DAY > YEAR?!"
  sprites: [orange circle, sun with face]
  bg: space

segments:
  - say: A day on Venus is longer than its whole year!
    headline: "DAY > YEAR?!"
    sprites:
      - {name: orange circle, x: 0.5, y: 0.45, size: 0.46, motion: float, label: VENUS}

  - say: Venus spins really, really slowly. One spin takes two hundred forty-three Earth days!
    headline: "1 SPIN = 243 DAYS"
    sprites:
      - {name: orange circle, x: 0.5, y: 0.45, size: 0.46, motion: spin, label: VENUS}

  - say: But its trip around the Sun takes only two hundred twenty-five days.
    headline: "1 YEAR = 225 DAYS"
    sprites:
      - {name: sun with face, x: 0.5, y: 0.44, size: 0.34, motion: pulse}
      - {name: orange circle, x: 0.15, y: 0.58, size: 0.14, motion: walk, to: [0.85, 0.3], enter: fade}

  - say: So on Venus, one day lasts longer than one year. Wild!
    headline: "WILD!"
    sprites:
      - {name: orange circle, x: 0.38, y: 0.46, size: 0.3, motion: float, label: VENUS}
      - {name: exploding head, x: 0.72, y: 0.4, size: 0.24, motion: wiggle, delay: 0.4}

  - say: Here's a bonus. Venus spins backwards compared to Earth.
    headline: "BACKWARDS!"
    sprites:
      - {name: orange circle, x: 0.5, y: 0.45, size: 0.4, motion: spin, rotate: 0}
      - {name: left arrow curving right, x: 0.5, y: 0.22, size: 0.14, motion: wiggle, delay: 0.3}

  - say: So on Venus, the Sun rises in the west and sets in the east!
    headline: "SUNRISE IN THE WEST"
    sprites:
      - {name: sunrise over mountains, x: 0.5, y: 0.45, size: 0.5, motion: float}

  - say: And Venus is super hot. It's hot enough to melt lead, much hotter than any oven!
    headline: "SUPER HOT"
    sprites:
      - {name: orange circle, x: 0.5, y: 0.45, size: 0.4, motion: shake}
      - {name: fire, x: 0.25, y: 0.32, size: 0.16, motion: wiggle, delay: 0.5}
      - {name: fire, x: 0.75, y: 0.32, size: 0.16, motion: wiggle, delay: 0.7}

  - say: Quick quiz! On Venus, which is longer, a day or a year? Say it out loud!
    headline: "QUIZ TIME!"
    bg: party
    bg_params: {scheme: sunset}
    sprites:
      - {name: bitsy, x: 0.5, y: 0.46, size: 0.44, motion: bounce}
      - {name: red question mark, x: 0.82, y: 0.3, size: 0.15, motion: wiggle, delay: 0.5}
    pause: 1.2

  - say: A day! Pretty weird, right? See you next time on Wonder Bites!
    headline: "A DAY!"
    bg: party
    bg_params: {scheme: sunset}
    sprites:
      - {name: bitsy_wink, x: 0.5, y: 0.46, size: 0.44, motion: bounce}
      - {name: party popper, x: 0.2, y: 0.3, size: 0.17, motion: wiggle, delay: 0.3}

sources:
  - "NASA Science, Venus: Facts: https://science.nasa.gov/venus/venus-facts/"
  - "NASA Space Place, All About Venus: https://spaceplace.nasa.gov/all-about-venus/en/"
